services:
  # # --- PostgreSQL Database for Moodle ---
  moodle_db:
    image: postgres:15
    restart: unless-stopped
    networks:
      - entrenai_net
    environment:
      POSTGRES_DB: ${DB_NAME:-moodle}
      POSTGRES_USER: ${DB_USER:-moodle}
      POSTGRES_PASSWORD: ${DB_PASS:-strongpass}
    volumes:
      - moodle_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # # --- Moodle Application ---
  moodle:
    build:
      context: .
      dockerfile: Dockerfile.moodle
    image: local/moodle:5
    networks:
      - entrenai_net
    depends_on:
      moodle_db:
        condition: service_healthy
    ports:
      - "8089:80"
    environment:
      MOODLE_URL: ${MOODLE_URL:-http://moodle:80}
      DB_HOST: ${MOODLE_DB_HOST:-moodle_db}
      DB_PORT: ${MOODLE_DB_PORT:-5432}
      DB_NAME: ${MOODLE_DB_NAME:-moodle}
      DB_USER: ${MOODLE_DB_USER:-moodle}
      DB_PASS: ${MOODLE_DB_PASS:-strongpass}
      SITE_FULLNAME: ${SITE_FULLNAME:-Moodle 5 Site}
      SITE_SHORTNAME: ${SITE_SHORTNAME:-M5}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-ChangeMe!123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ENTRENAI_USER_PASSWORD: ${ENTRENAI_USER_PASSWORD:-ChangeMe!123}
      BOOTSTRAP_FIXTURES: ${BOOTSTRAP_FIXTURES:-0}
    volumes:
      - moodle_code:/var/www/html
      - moodle_data:/var/moodledata
      - ./bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/login/index.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # --- PGVector Database ---
  pgvector_db:
    image: pgvector/pgvector:0.8.0-pg17 # Includes pgvector extension
    container_name: entrenai_pgvector_db
    restart: unless-stopped
    ports:
      - "${PGVECTOR_HOST_PORT:-5432}:5432" # Expose on a different host port if 5432 is taken
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./src/entrenai/core/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-pgvector_user}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-pgvector_password}
      POSTGRES_DB: ${PGVECTOR_DB_NAME:-pgvector_db}
      # Optional: Command to create extension if not automatically handled by the image
    networks:
      - entrenai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pgvector_user} -d $${POSTGRES_DB:-pgvector_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Ollama LLM Server ---
  # ollama:
  #   image: ollama/ollama:0.12.9
  #   container_name: entrenai_ollama
  #   restart: unless-stopped
  #   runtime: nvidia
  #   ports:
  #     - "${OLLAMA_HOST_PORT:-11434}:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama # Persist models
  #   environment:
  #     - OLLAMA_KEEP_ALIVE=10m
  #     - OLLAMA_MAX_LOADED_MODELS=2
  #     - OLLAMA_CONTEXT_LENGTH=32768
  #     - OLLAMA_FLASH_ATTENTION=true
  #     - OLLAMA_GPU_OVERHEAD=0
  #     - OLLAMA_LLM_LIBRARY=auto
  #     - NVIDIA_VISIBLE_DEVICES=all
  #     - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  #     - OLLAMA_CUDA=1
  #     - OLLAMA_NUM_GPU_LAYERS=999
  #     - OLLAMA_KV_CACHE_TYPE=q8_0
  #     - OLLAMA_LLM_LIBRARY=cuda
  #     - CUDA_VISIBLE_DEVICES=0
  #     - OLLAMA_MAX_QUEUE=1024
  #     - OLLAMA_NUM_PARALLEL=2
  #   entrypoint:
  #     - /bin/sh
  #     - -c
  #     - |
  #       ollama serve &
  #       sleep 10 &&
  #       ollama pull qwen3:1.7b-q8_0 &&
  #       ollama pull qwen3-embedding:8b &&
  #       # preload only the generative model
  #       ollama run qwen3:1.7b-q8_0 &&
  #       wait
  #   networks:
  #     - entrenai_net
  #   devices:
  #     - /dev/nvidia0
  #     - /dev/nvidiactl
  #     - /dev/nvidia-uvm
  #     - /dev/nvidia-uvm-tools
  #     - /dev/nvidia-modeset
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1 # or 'all'
  #             capabilities: [gpu]

  # --- vLLM OpenAI-Compatible Server ---
  vllm:
    image: vllm/vllm-openai:latest
    container_name: entrenai_vllm
    runtime: nvidia
    ports:
      - "${VLLM_HOST_PORT:-8001}:8000"
    volumes:
      - vllm_models:/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/models/hf-cache
      - HF_TOKEN=${VLLM_HF_TOKEN:-}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      --model ${VLLM_CHAT_MODEL_PATH:-Qwen/Qwen3-4B-Instruct-2507-FP8}
      --served-model-name ${VLLM_CHAT_MODEL:-qwen3-4b-instruct-fp8}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.40}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --api-key ${VLLM_API_KEY:-replace-with-secure-token}
      --download-dir /models
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - entrenai_net

  # --- vLLM Embedding Server ---
  vllm-embedding:
    image: vllm/vllm-openai:latest
    container_name: entrenai_vllm_embedding
    runtime: nvidia
    ports:
      - "${VLLM_EMBED_HOST_PORT:-8002}:8000"
    volumes:
      - vllm_embedding_models:/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/models/hf-cache
      - HF_TOKEN=${VLLM_HF_TOKEN:-}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      --model ${VLLM_EMBEDDING_MODEL_PATH:-Qwen/Qwen3-Embedding-4B}
      --served-model-name ${VLLM_EMBEDDING_MODEL:-qwen3-embedding-4b}
      --gpu-memory-utilization ${VLLM_EMBED_GPU_MEMORY_UTILIZATION:-0.30}
      --max-model-len ${VLLM_EMBED_MAX_MODEL_LEN:-32768}
      --api-key ${VLLM_API_KEY:-replace-with-secure-token}
      --download-dir /models
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
      --task embedding
      --dtype half
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - entrenai_net


  # --- PostgreSQL Database for N8N ---
  n8n_db:
    image: postgres:17.5
    container_name: entrenai_n8n_db
    restart: unless-stopped
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n_user}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n_password}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n_db}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD}
    networks:
      - entrenai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n_user} -d $${POSTGRES_DB:-n8n_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- N8N Workflow Automation ---
  n8n:
    image: n8nio/n8n:1.117.3
    container_name: entrenai_n8n_app
    restart: unless-stopped
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_app_data:/home/node/.n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n_db
      DB_POSTGRESDB_PORT: 5432
      N8N_SECURE_COOKIE: false
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n_db}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n_user}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-a_very_secure_random_string_for_n8n} # CHANGE THIS IN .env!
      N8N_EMAIL_MODE: smtp # Placeholder, can be configured later if email sending is needed
      N8N_HOST: ${N8N_HOST_DOMAIN:-n8n.42n.com.ar} # Set to your domain if N8N is publicly accessible
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.42n.com.ar} # URL N8N uses for its webhooks
      # GENERIC_TIMEZONE: America/Argentina/Buenos_Aires # Set your timezone
    depends_on:
      n8n_db:
        condition: service_healthy
    networks:
      - entrenai_net

  fastapi_backend:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: entrenai_fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src # For development hot-reloading; remove for production if code is solely from image
      - entrenai_data:/app/data # For downloads, markdown files, etc.
    env_file:
      - .env
    environment:
      APP_ENV: docker # To ensure docker-specific configurations are loaded
      DATA_DIR: /app/data # Standardized data directory within the container
      # Add any other necessary backend-specific environment variables from .env if not covered by env_file
      # For example, ensure FastAPI host/port are set if uvicorn command in Dockerfile.fastapi doesn't use defaults
      # Or if they are read from base_config which is loaded via .env
    depends_on:
      redis:
        condition: service_healthy
      pgvector_db:
        condition: service_healthy
      vllm:
        condition: service_started
      vllm-embedding:
        condition: service_started
      # moodle_db: # If the API interacts with Moodle services that depend on Moodle DB directly
      #   condition: service_healthy
        # Add other necessary dependencies
    networks:
      - entrenai_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"] # Basic health check for FastAPI
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s # Give it some time to start up

  # --- Redis for Celery ---
  redis:
    image: "redis:alpine"
    container_name: entrenai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - entrenai_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: entrenai_celery_worker # Can remain the same
    restart: unless-stopped
    command: sh -c "celery -A src.entrenai.celery_app.app worker -l INFO -P eventlet"
    # No src volume mount needed as Dockerfile.celery copies necessary files
    # No data volume mount needed as it doesn't process files directly
    env_file:
      - .env
    environment:
      APP_ENV: docker # May not be strictly needed by celery worker but often inherited
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FASTAPI_BACKEND_URL: http://fastapi_backend:8000 # URL for the backend API
      # PYTHONUNBUFFERED: 1 # Good for seeing logs immediately
    depends_on:
      redis:
        condition: service_healthy
      fastapi_backend:
        condition: service_started
      vllm:
        condition: service_started
      vllm-embedding:
        condition: service_started
    networks:
      - entrenai_net

# (Optional) ADD this GPU check service to the same compose (use when needed)
  cuda-smi:
    image: nvidia/cuda:12.9.0-base-ubuntu22.04
    command: ["bash","-lc","nvidia-smi && ls -l /dev/nvidia*"]
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - entrenai_net

  # --- Nginx Proxy Manager ---
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: entrenai_nginx_proxy_manager
    restart: unless-stopped
    ports:
      - '80:80'      # HTTP
      - '443:443'    # HTTPS
      - '81:81'      # Admin Web UI
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    environment:
      DISABLE_IPV6: 'true'
    networks:
      - entrenai_net
    depends_on:
      - moodle
      - n8n
      - fastapi_backend

volumes:
  npm_data:
    driver: local
  npm_letsencrypt:
    driver: local
  moodle_app_data:
    driver: local
  moodle_data_dir:
    driver: local
  pgvector_data: 
    driver: local
  ollama_models:
    driver: local
  vllm_models:
    driver: local
  vllm_embedding_models:
    driver: local
  n8n_db_data:
    driver: local
  n8n_app_data:
    driver: local
  redis_data: # Added for Redis
    driver: local
  entrenai_data: # Added for Celery worker data
    driver: local
  moodle_db_data:
  moodle_code:
  moodle_data:

networks:
  entrenai_net:
    driver: bridge

