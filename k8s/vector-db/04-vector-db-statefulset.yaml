apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vector-db
  namespace: lucas-garcia-entrenai-no-borrar
spec:
  serviceName: "vector-db-service"
  replicas: 1
  selector:
    matchLabels:
      app: vector-db
  template:
    metadata:
      labels:
        app: vector-db
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: vector-db-secret
        - configMapRef:
            name: vector-db-config
        volumeMounts:
        - name: vector-db-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: vector-db-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
