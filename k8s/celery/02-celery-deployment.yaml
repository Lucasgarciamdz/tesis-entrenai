apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: lucas-garcia-entrenai-no-borrar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: lucas-garcia-entrenai-no-borrar-celery:latest
        imagePullPolicy: IfNotPresent # Assumes local image
        command: [ "celery", "-A", "entrenai.celery_app", "worker", "--loglevel=info" ]
        envFrom:
        - configMapRef:
            name: celery-config
        # Secrets for database connection should be mounted here
        # Re-using vector-db-secret for simplicity, but a dedicated one is better practice
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: vector-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vector-db-secret
              key: POSTGRES_PASSWORD
