apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: n8n-db
  namespace: lucas-garcia-entrenai-no-borrar
spec:
  serviceName: "n8n-db-service"
  replicas: 1
  selector:
    matchLabels:
      app: n8n-db
  template:
    metadata:
      labels:
        app: n8n-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: n8n-db-secret
        - configMapRef:
            name: n8n-db-config
        volumeMounts:
        - name: n8n-db-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: n8n-db-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
